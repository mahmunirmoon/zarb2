<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- سایه‌ی سخت به سبک دکمه‌های بازی -->
  <rect x="8" y="9" width="46" height="46" rx="14" fill="#33306b"/>
  <!-- کاشی لیمویی با حاشیه‌ی ضخیم -->
  <rect x="3" y="3" width="46" height="46" rx="14" fill="#ffc53d" stroke="#33306b" stroke-width="3.5"/>
  <!-- برقِ آبنباتی گوشه -->
  <path d="M12 21 Q12 12 21 12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity=".65"/>
  <!-- علامت ضرب: لایه‌ی سرمه‌ای زیر لایه‌ی سفید -->
