    <path d="M17 17 L35 35 M35 17 L17 35" stroke="#33306b" stroke-width="14"/>
    <path d="M17 17 L35 35 M35 17 L17 35" stroke="#ffffff" stroke-width="8"/>
  </g>
  <!-- ستاره‌ی جایزه روی گوشه‌ی کارت -->
  <path transform="translate(45.5 13) rotate(15) scale(0.85)"
        d="M0 -8 L2 -2.75 L7.61 -2.47 L3.23 1.05 L4.7 6.47 L0 3.4 L-4.7 6.47 L-3.23 1.05 L-7.61 -2.47 L-2 -2.75 Z"
