# Build and deploy the Vite project to GitHub Pages
# Site URL: https://mahmunirmoon.github.io/zarb2/
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main', 'master']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but do NOT cancel in-progress runs
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build with a RELATIVE base path (./) so every asset is referenced as
      # ./assets/... and resolves correctly under https://mahmunirmoon.github.io/zarb2/
      # (an absolute base like "/" would point to the domain root and 404,
      # leaving a blank page). Applied at build time so local builds are unaffected.
      - name: Build
        run: npm run build -- --base=./

      # Print the built HTML, then verify that every asset referenced by
      # dist/index.html actually exists in dist and uses a relative ./assets/
      # path. This prevents silent blank-page deploys (404'd bundles).
      - name: Verify built assets
        run: |
          echo "---- dist/index.html ----"
          cat dist/index.html
          echo "---- dist files ----"
          find dist -type f
          if grep -q '="/assets/' dist/index.html; then
            echo "::error::dist/index.html references absolute /assets/ paths — the base flag was not applied!"
            exit 1
          fi
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)=\"(\.\/assets\/[^\"]+)\"/g)].map((m) => m[1]);
          if (refs.length === 0) { console.error('::error::No ./assets/ references found in dist/index.html'); process.exit(1); }
          for (const r of refs) {
            const p = 'dist/' + r.replace(/^\.\//, '');
            if (!fs.existsSync(p)) { console.error('::error::Referenced asset missing from dist: ' + p); process.exit(1); }
            console.log('asset OK: ' + p);
          }
          "

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
